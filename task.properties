# new table latest api
CREATE TABLE `wput_latest_api` (
  `latest_id` int(11) NOT NULL AUTO_INCREMENT,
  `post_id` int(11) NOT NULL,
  `cat_name` varchar(200) NOT NULL,
  `title` varchar(2200) NOT NULL,
  `slug` varchar(2000) NOT NULL,
  `img_thumb` varchar(2200) NOT NULL,
  `img_mid` varchar(2200) NOT NULL,
  `url` varchar(2200) NOT NULL,
  `display_name` varchar(200) NOT NULL,
  `date` datetime NOT NULL,
  `created_at` timestamp NOT NULL DEFAULT current_timestamp() ON UPDATE current_timestamp(),
  PRIMARY KEY (`latest_id`)
) ENGINE=InnoDB AUTO_INCREMENT=6 DEFAULT CHARSET=latin1

