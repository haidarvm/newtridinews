SELECT `wprg_p`.`ID`,`post_date`,`post_title`,`category_name`,`display_name`,`total_pageviews`,CASE when img_thumb <> '' then CONCAT('https://jabarnews.com/assets/uploads/', '', img_thumb) end AS `img_thumb`,CASE when img_mid <> '' then CONCAT('https://jabarnews.com/assets/uploads/', '', img_mid) end AS `img_mid` FROM `wprg_posts` AS `wprg_p` LEFT JOIN `wprg_image_featured` AS `wprg_i` ON `wprg_p`.`ID` = `wprg_i`.`post_id` LEFT JOIN `wprg_list_category` AS `wprg_c` ON `wprg_p`.`ID` = `wprg_c`.`post_id` LEFT JOIN `wprg_popular_posts` AS `wprg_pop` ON `wprg_p`.`ID` = `wprg_pop`.`post_id` LEFT JOIN `wprg_users` AS `wprg_u` ON `wprg_p`.`post_author` = `wprg_u`.`ID` WHERE YEAR(post_date) = YEAR(NOW()) AND DATE(post_date) >= DATE(CURRENT_DATE - INTERVAL 14 DAY) AND MONTH(post_date) <= MONTH(NOW()) GROUP BY `wprg_pop`.`post_id` ORDER BY total_pageviews DESC LIMIT 4


