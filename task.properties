CREATE TABLE `wput_product_img` (
  `product_img_id` int(11) NOT NULL AUTO_INCREMENT,
  `product_id` smallint(5) NOT NULL,
  `thumb` varchar(1000) NOT NULL,
  `img_mid` varchar(1000) NOT NULL,
