SELECT `wprg_p`.`ID`,`post_date`,`post_title`,`category_name`,`display_name`,`total_pageviews`,CASE when img_thumb <> '' then CONCAT('https://jabarnews.com/assets/uploads/', '', img_thumb) end AS `img_thumb`,CASE when img_mid <> '' then CONCAT('https://jabarnews.com/assets/uploads/', '', img_mid) end AS `img_mid` FROM `wprg_posts` AS `wprg_p` LEFT JOIN `wprg_image_featured` AS `wprg_i` ON `wprg_p`.`ID` = `wprg_i`.`post_id` LEFT JOIN `wprg_list_category` AS `wprg_c` ON `wprg_p`.`ID` = `wprg_c`.`post_id` LEFT JOIN `wprg_popular_posts` AS `wprg_pop` ON `wprg_p`.`ID` = `wprg_pop`.`post_id` LEFT JOIN `wprg_users` AS `wprg_u` ON `wprg_p`.`post_author` = `wprg_u`.`ID` WHERE YEAR(post_date) = YEAR(NOW()) AND DATE(post_date) >= DATE(CURRENT_DATE - INTERVAL 14 DAY) AND MONTH(post_date) <= MONTH(NOW()) GROUP BY `wprg_pop`.`post_id` ORDER BY total_pageviews DESC LIMIT 4


select `wpw4_ca`.`category_name` as `cat_name`, `wpw4_p`.`ID` as `ID`, `post_title`, `post_date`, `full_path`, `img_mid` from `wpw4_popular_posts` as `wpw4_pop` left join `wpw4_posts` as `wpw4_p` on `wpw4_p`.`ID` = `wpw4_pop`.`post_id` left join `wpw4_list_category` as `wpw4_c` on `wpw4_c`.`post_id` = `wpw4_p`.`ID` left join `wpw4_category` as `wpw4_ca` on `wpw4_ca`.`category_id` = `wpw4_c`.`category_id` left join `wpw4_image_featured` as `wpw4_f` on `wpw4_p`.`ID` = `wpw4_f`.`post_id` where year(`post_date`) = YEAR(NOW()) and date(`post_date`) >= DATE(CURRENT_DATE - INTERVAL 14 DAY) and month(`post_date`) = MONTH(NOW()) group by `wpw4_pop`.`post_id` order by `total_pageviews` desc limit 5


select `wput_ca`.`category_name` as `cat_name`, `wput_p`.`ID` as `ID`, `post_title`, `post_date`, `post_author`, `img_thumb`, `full_path`, `img_mid`, `display_name` from `wput_posts` as `wput_p` left join `wput_users` as `wput_u` on `wput_u`.`ID` = `wput_p`.`post_author` left join `wput_list_category` as `wput_c` on `wput_c`.`post_id` = `wput_p`.`ID` left join `wput_category` as `wput_ca` on `wput_ca`.`category_id` = `wput_c`.`category_id` left join `wput_image_featured` as `wput_f` on `wput_p`.`ID` = `wput_f`.`post_id` left join `wput_reporter` as `wput_r` on `wput_p`.`reporter_id` = `wput_r`.`reporter_id` where (`post_status` = 'publish' and `post_type` = 'post' and `wput_c`.`category_id` = 613) group by `wput_p`.`ID` order by `post_date` desc limit 11 offset 0
